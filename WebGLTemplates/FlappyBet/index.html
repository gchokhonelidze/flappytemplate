<!DOCTYPE html>
<html lang="en-us">

<head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>{{{ PRODUCT_NAME }}}</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<style>
		/* Viewport size the game is laid out against. Falls back through
		   vh -> svh -> a JS-measured pixel value (see applyViewportLayout). */
		:root {
			--app-w: 100vw;
			--app-h: 100vh;
		}

		@supports (height: 100svh) {
			:root {
				/* svh = "small viewport": the height that stays visible even when
				   iOS Safari's URL bar and bottom toolbar are both expanded. */
				--app-h: 100svh;
			}
		}

		html,
		body {
			background: {{{ BACKGROUND || '#000' }}};
			width: 100%;
			height: 100%;
			overflow: hidden;
			overscroll-behavior: none;
			padding: 0;
			margin: 0;
			position: fixed;
			inset: 0;
			touch-action: none;
		}

		div#gameContainer {
			background: transparent !important;
			position: fixed;
			top: 0;
			left: 0;
			width: var(--app-w);
			height: var(--app-h);
		}

		div#gameContainer canvas {
			position: absolute;
			inset: 0;
			width: 100% !important;
			height: 100% !important;
			display: block;
			-webkit-user-select: none;
			user-select: none;
			touch-action: none;
		}

		div#gameContainer canvas[data-pixel-art="true"] {
			position: absolute;
			image-rendering: optimizeSpeed;
			image-rendering: -webkit-crisp-edges;
			image-rendering: -moz-crisp-edges;
			image-rendering: -o-crisp-edges;
			image-rendering: crisp-edges;
			image-rendering: -webkit-optimize-contrast;
			image-rendering: optimize-contrast;
			image-rendering: pixelated;
			-ms-interpolation-mode: nearest-neighbor;
		}

		#loading-overlay {
			position: fixed;
			inset: 0;
			z-index: 10;
			background: #1a1a2e;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			transition: opacity 0.4s ease;
		}

		#loading-overlay.hidden {
			opacity: 0;
			pointer-events: none;
		}

		#loading-bar-container {
			width: 280px;
			height: 6px;
			background: rgba(255, 255, 255, 0.1);
			border-radius: 3px;
			overflow: hidden;
		}

		#loading-bar-fill {
			height: 100%;
			width: 0%;
			background: linear-gradient(90deg, #e94560, #0f3460);
			border-radius: 3px;
			transition: width 0.3s ease;
		}

		#loading-text {
			margin-top: 12px;
			color: rgba(255, 255, 255, 0.6);
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			font-size: 13px;
			letter-spacing: 1px;
		}
	</style>
	<script>
		// Browser extensions (crypto wallets above all) inject scripts into every page,
		// and when they break, the error lands on this window. Unity's loader turns any
		// page error into a blocking alert() naming our domain, so drop the extension's
		// errors before the loader hears of them. Registered here in <head>, ahead of
		// the loader's own listeners, so stopImmediatePropagation keeps them from it -
		// even while the game is still loading, when the loader would otherwise
		// reject createUnityInstance over them.
		(function ignoreExtensionErrors() {
			var EXTENSION_URL = /(chrome|moz|safari(-web)?|ms-browser)-extension:\/\//;
			function fromExtension(e) {
				var err = e.error || e.reason;
				var where = (e.filename || '') + '\n' + (err && err.fileName || '') + '\n' + (err && err.stack || '');
				return EXTENSION_URL.test(where);
			}
			function swallow(e) {
				if (!fromExtension(e)) return;
				e.stopImmediatePropagation();
				e.preventDefault();
				console.warn('Ignored an error from a browser extension:', e.error || e.reason || e.message);
			}
			window.addEventListener('error', swallow);
			window.addEventListener('unhandledrejection', swallow);
		})();
	</script>
	<script>
		// Ceiling on the WebGL backing buffer, which Unity sizes as
		// (CSS size x window.devicePixelRatio).
		//
		// Measured: clamping this to 2 on an iPhone 15 Pro halved the pixel count and
		// changed the frame rate not at all - the cost was in the shadow pass, which is
		// sized by the shadow map, not the screen. So 3 is left alone; native density on
		// a modern phone anti-aliases better than MSAA and costs less. Lower this only if
		// profiling actually shows a fragment/fill bottleneck.
		// Must run before the Unity loader reads the ratio, hence <head>.
		var MAX_DEVICE_PIXEL_RATIO = 3;
		(function clampDevicePixelRatio() {
			try {
				var proto = Object.getPrototypeOf(window) || window.Window.prototype;
				var desc = Object.getOwnPropertyDescriptor(window, 'devicePixelRatio') ||
					Object.getOwnPropertyDescriptor(proto, 'devicePixelRatio');
				if (!desc || typeof desc.get !== 'function') return;

				var nativeGet = desc.get;
				Object.defineProperty(window, 'devicePixelRatio', {
					configurable: true,
					get: function () {
						// Only ever clamp down, never scale a low-DPI display up.
						return Math.min(nativeGet.call(window), MAX_DEVICE_PIXEL_RATIO);
					}
				});
			} catch (e) {
				// Non-fatal - we just render at the device's native pixel ratio.
			}
		})();
	</script>
	<script src="https://unpkg.com/@microsoft/signalr@10.0.0/dist/browser/signalr.min.js" integrity="sha384-WlPNGnp2GG/eMuGnbuG2p5ov9pzHsqoPQbzjOz61V608d7JfDa+3abt0YOoyUwU5" crossorigin="anonymous"></script>
</head>

<body>
	<div id="gameContainer">
		<canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" data-pixel-art="{{{ OPTIMIZE_FOR_PIXEL_ART }}}"></canvas>
		<div id="loading-overlay">
			<div id="loading-bar-container">
				<div id="loading-bar-fill"></div>
			</div>
			<div id="loading-text">0%</div>
		</div>
		<script src="Build/{{{ LOADER_FILENAME }}}"></script>
		<script>
			var canvas = document.querySelector("#unity-canvas");
			var config = {
				dataUrl: "Build/{{{ DATA_FILENAME }}}",
				frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
				codeUrl: "Build/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
				memoryUrl: "Build/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
				symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
				streamingAssetsUrl: "StreamingAssets",
				companyName: "{{{ COMPANY_NAME }}}",
				productName: "{{{ PRODUCT_NAME }}}",
				productVersion: "{{{ PRODUCT_VERSION }}}",
				autoSyncPersistentDataPath: true,
				// Unity's loader checks Module.devicePixelRatio BEFORE falling back to
				// window.devicePixelRatio, so this is the supported way to cap the backing
				// buffer. The window getter patch above does not take on every browser
				// (notably Chrome/Samsung Internet on Android); this path always does.
				devicePixelRatio: Math.min(window.devicePixelRatio || 1, MAX_DEVICE_PIXEL_RATIO),
				// Returning true tells the loader the error is handled, so it never puts up
				// its "An error occurred running the Unity content" alert - a player can do
				// nothing with it. The error still goes to the console for us.
				errorHandler: function (message, filename, lineno) {
					console.error('Unity error' + (filename ? ' at ' + filename + ':' + lineno : '') + '\n' + message);
					return true;
				},
			};
			var scaleToFit;
			try {
				scaleToFit = !!JSON.parse("{{{ SCALE_TO_FIT }}}");
			} catch (e) {
				scaleToFit = true;
			}
			var wasmFillTimer = null;
			var displayedPct = 0;

			function setBar(pct) {
				displayedPct = pct;
				var fill = document.getElementById('loading-bar-fill');
				var text = document.getElementById('loading-text');
				if (fill) fill.style.width = pct + '%';
				if (text) text.textContent = pct + '%';
			}

			function progressHandler(progress) {
				var pct = Math.round(progress * 100);
				if (pct >= 90 && !wasmFillTimer) {
					setBar(90);
					wasmFillTimer = setInterval(function () {
						if (displayedPct < 99) {
							setBar(displayedPct + 1);
						} else {
							clearInterval(wasmFillTimer);
						}
					}, 800);
				} else if (!wasmFillTimer) {
					setBar(pct);
				}
			}

			function clearLoader() {
				if (wasmFillTimer) { clearInterval(wasmFillTimer); wasmFillTimer = null; }
				setBar(100);
				setTimeout(function () {
					var overlay = document.getElementById('loading-overlay');
					if (overlay) {
						overlay.classList.add('hidden');
						setTimeout(function () { overlay.remove(); }, 500);
					}
				}, 300);
			}

			function focusCanvas() {
				if (typeof canvas.focus === 'function') {
					canvas.focus();
				}
			}
			// iOS Safari's 100vh includes the strip hidden behind the URL bar and
			// the bottom toolbar, so anything anchored to the bottom of the game
			// (buttons) ends up rendered off-screen. visualViewport reports the
			// area that is actually visible right now, so pin the layout to that.
			var layoutFrame = null;
			function applyViewportLayout() {
				if (layoutFrame) return;
				layoutFrame = requestAnimationFrame(function () {
					layoutFrame = null;
					var vv = window.visualViewport;
					var w = Math.round(vv ? vv.width : window.innerWidth);
					var h = Math.round(vv ? vv.height : window.innerHeight);
					if (w <= 0 || h <= 0) return;
					var root = document.documentElement;
					root.style.setProperty('--app-w', w + 'px');
					root.style.setProperty('--app-h', h + 'px');
					// Keep the page itself pinned to the top-left of the visible area
					// in case iOS scrolled it while the toolbars animated.
					window.scrollTo(0, 0);
				});
			}
			function onResizeOld() {
				var container = canvas.parentElement;
				var w;
				var h;

				if (scaleToFit) {
					w = window.innerWidth;
					h = window.innerHeight;

					var r = {{{ HEIGHT }}} / {{{ WIDTH }}};

					if (w * r > window.innerHeight) {
						w = Math.min(w, Math.ceil(h / r));
					}
					h = Math.floor(w * r);
				} else {
					w = {{{ WIDTH }}};
					h = {{{ HEIGHT }}};
				}

				container.style.width = canvas.style.width = w + "px";
				container.style.height = canvas.style.height = h + "px";
				container.style.top = Math.floor((window.innerHeight - h) / 2) + "px";
				container.style.left = Math.floor((window.innerWidth - w) / 2) + "px";
				window.focus();
			}
			createUnityInstance(canvas, config, progressHandler).then(function (instance) {
				window.MyGameInstance = instance;
				canvas = instance.Module.canvas;
				clearLoader();
				canvas.tabIndex = 1;
				canvas.style.outline = 'none';
				applyViewportLayout();
				requestAnimationFrame(function () {
					focusCanvas();
				});
			}).catch(function (error) {
				console.error('Unity failed to start\n' + error);
			});
			window.addEventListener('resize', applyViewportLayout);
			window.addEventListener('orientationchange', function () {
				// iOS reports stale metrics right after the rotation event.
				applyViewportLayout();
				setTimeout(applyViewportLayout, 300);
			});
			if (window.visualViewport) {
				window.visualViewport.addEventListener('resize', applyViewportLayout);
				window.visualViewport.addEventListener('scroll', applyViewportLayout);
			}
			window.addEventListener('pointerdown', focusCanvas, { passive: true });
			window.addEventListener('touchstart', focusCanvas, { passive: true });
			document.addEventListener('visibilitychange', function () {
				if (!document.hidden) {
					requestAnimationFrame(function () {
						applyViewportLayout();
						focusCanvas();
					});
				}
			});
			applyViewportLayout();
		</script>
	</div>
</body>

</html>
